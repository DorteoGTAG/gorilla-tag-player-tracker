<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorilla Tag Player Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay-container">
        <div class="tracker-panel">
            <div class="header">
                <h1>🐵 GT Player Tracker</h1>
                <button class="close-btn" onclick="minimizePanel()" aria-label="Minimize">
                    <span>−</span>
                </button>
            </div>

            <div class="search-section">
                <input
                    type="text"
                    id="playerInput"
                    class="player-input"
                    placeholder="Enter Player ID..."
                    onkeypress="handleKeyPress(event)"
                    autocomplete="off"
                >
                <button class="search-btn" onclick="trackPlayer()">Track</button>
            </div>

            <div class="result-panel" id="resultPanel">
                <div class="placeholder">
                    <p>Enter a player ID to track</p>
                </div>
            </div>

            <div class="recent-section">
                <h3>Recent Searches</h3>
                <div class="recent-list" id="recentList">
                    <p class="empty">No recent searches</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
